  {answer:"КОНФЕТА",part1:"ФОН",part2:"КЕТА",clue1:"То, на чём выделяется главный предмет",clue2:"Красная рыба из семейства лососёвых"},
  {answer:"САМОКАТ",part1:"САМА",part2:"КОТ",clue1:"Она сделала это без посторонней помощи: …",clue2:"Домашний питомец, который мурлычет"},
  {answer:"БУМАГА",part1:"БУМ",part2:"АГА",clue1:"Звук громкого удара",clue2:"Возглас, когда что-то понял"}
 ]}
];
const STORAGE_KEY="wordArithmetic_fiveLevels_v1";
const screen=document.getElementById("screen");
const progress={solved:LEVELS.map(()=>[]),lastLevel:0};
try {
 const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
 if(data && Array.isArray(data.solved)) {
  for(let i=0;i<LEVELS.length;i++) if(Array.isArray(data.solved[i]))
   progress.solved[i]=[...new Set(data.solved[i].filter(j=>Number.isInteger(j)&&j>=0&&j<LEVELS[i].tasks.length))];
  progress.lastLevel=Number.isInteger(data.lastLevel)&&data.lastLevel>=0&&data.lastLevel<LEVELS.length?data.lastLevel:0;
 }
 // Carry over progress from previous two-level game if present, but never overwrite new results.
 if(!data){const older=JSON.parse(localStorage.getItem("wordArithmetic_v1")||"null");if(older&&Array.isArray(older.solved))for(let i=0;i<2;i++)if(Array.isArray(older.solved[i]))progress.solved[i]=[...new Set(older.solved[i].filter(j=>Number.isInteger(j)&&j>=0&&j<6))];}
} catch(_e) {}
let view="home",levelIndex=0,taskIndex=0,phase="build",removeIds=[],choiceIds=[],pool=[],hintCount=0,feedback="",feedbackType="",soundOn=false,audioCtx;
const current=()=>LEVELS[levelIndex].tasks[taskIndex];
const solved=(li,ti)=>progress.solved[li].includes(ti);
const count=li=>progress.solved[li].length;
const total=()=>progress.solved.reduce((n,a)=>n+a.length,0);
const MAX_TASKS=LEVELS.reduce((n,l)=>n+l.tasks.length,0);
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress))}catch(_e){}}
function countsMatch(xs,ys){if(xs.length!==ys.length)return false;let bag={};for(const ch of xs)bag[ch]=(bag[ch]||0)+1;for(const ch of ys){bag[ch]=(bag[ch]||0)-1;if(bag[ch]<0)return false}return Object.values(bag).every(v=>v===0)}
function difference(whole,subtract){let rest=[...whole];for(const ch of subtract){let i=rest.indexOf(ch);if(i<0)throw Error("Не совпадают буквы: "+whole+" / "+subtract);rest.splice(i,1)}return rest}
function shuffle(arr,seed){let r=arr.slice(),n=(seed+7)*59411+721;for(let i=r.length-1;i>0;i--){n=(n*1664525+1013904223)>>>0;const j=n%(i+1);[r[i],r[j]]=[r[j],r[i]]}return r}
function freshPool(){const t=current(),mode=LEVELS[levelIndex].mode;const letters=mode==="plus"?[...t.a,...t.b]:mode==="minus"?[...t.a]:mode==="missing"?difference(t.answer,t.a):[...t.answer];pool=shuffle(letters.map((ch,id)=>({id,ch})),taskIndex+levelIndex*23)}
function startLevel(i){levelIndex=i;progress.lastLevel=i;save();const next=LEVELS[i].tasks.findIndex((_,j)=>!solved(i,j));if(next<0){view="finish";render()}else goTask(next)}
function goTask(i){taskIndex=i;view="task";const mode=LEVELS[levelIndex].mode;phase=mode==="minus"?"remove":mode==="split"?"split1":"build";removeIds=[];choiceIds=[];hintCount=0;feedback="";feedbackType="";freshPool();render()}
function goHome(){view="home";render()}
function sound(type){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime,notes=type==="success"?[523,659,784]:type==="wrong"?[220,196]:[440];notes.forEach((note,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),at=now+i*.085;o.type="sine";o.frequency.value=note;g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(.055,at+.013);g.gain.exponentialRampToValueAtTime(.001,at+.18);o.connect(g).connect(audioCtx.destination);o.start(at);o.stop(at+.2)})}catch(_e){}}
function validateData(){if(LEVELS.length!==5)throw Error("Need five levels");for(let i=0;i<LEVELS.length;i++){const level=LEVELS[i];if(level.tasks.length!==6)throw Error("Need six tasks at each level");for(const t of level.tasks){if(level.mode==="plus"&&!countsMatch([...t.a,...t.b],[...t.answer]))throw Error("Неверное сложение: "+t.a);if(level.mode==="minus"&&!countsMatch(difference(t.a,t.b),[...t.answer]))throw Error("Неверное вычитание: "+t.a);if(level.mode==="missing"&&!countsMatch([...t.a,...t.missing],[...t.answer]))throw Error("Неверный вопрос: "+t.answer);if(level.mode==="split"&&!countsMatch([...t.part1,...t.part2],[...t.answer]))throw Error("Неверная пара: "+t.answer)}}}
function render(){document.getElementById("homeBtn").style.visibility=view==="home"?"hidden":"visible";const sb=document.getElementById("soundBtn");sb.textContent=(soundOn?"🔊":"🔇")+" Звук";sb.setAttribute("aria-label",soundOn?"Выключить звуки":"Включить звуки");if(view==="home")renderHome();else if(view==="finish")renderFinish();else renderTask()}
function renderHome(){const cards=LEVELS.map((l,i)=>`<article class="level-card l${i+1}"><div class="level-meta"><span>УРОВЕНЬ ${i+1}</span><span class="level-type">${i<2?"БАЗОВЫЙ":i===2?"ПОВЫШЕННЫЙ":"СЛОЖНЫЙ"}</span><span>⭐ ${count(i)} / ${l.tasks.length}</span></div><h2>${l.name}</h2><p>${l.blurb}</p><div class="example">${l.sample.replaceAll(" + "," <span class='op'>+</span> ").replaceAll(" − "," <span class='op'>−</span> ")}</div><button type="button" class="wide-btn" data-action="start" data-level="${i}">${count(i)===6?"✓ Посмотреть результат":count(i)?"▶ Продолжить":"▶ Начать уровень"}</button></article>`).join("");screen.innerHTML=`<div class="home-hero"><span class="page-eyebrow">🧩 5 уровней · ${MAX_TASKS} заданий</span><h1>Словарная <span>арифметика</span></h1><p class="lead">Слова можно складывать, вычитать и даже разбирать обратно! Пройди путь от коротких примеров до настоящих буквенных головоломок.</p><div class="floating-letters" aria-hidden="true"><span class="little-letter">С</span><span class="little-letter">Л</span><span class="little-letter">О</span><span class="little-letter">В</span></div><div class="teacher-bar">Твой прогресс: <strong>${total()} из ${MAX_TASKS}</strong>. Можно выбрать любой уровень.</div></div><section class="level-grid" aria-label="Выбор уровня">${cards}</section><p class="instruction-home">💡 <span>В каждом уровне <strong>6 заданий</strong>. Ошибки исправляются без штрафов; буквы нельзя использовать дважды.</span></p>`}
function dots(){return LEVELS[levelIndex].tasks.map((_,i)=>`<button type="button" class="progress-dot ${solved(levelIndex,i)?"done":""} ${taskIndex===i?"active":""}" data-action="task" data-index="${i}" aria-label="Задание ${i+1}${solved(levelIndex,i)?", выполнено":""}">${solved(levelIndex,i)?"✓":i+1}</button>`).join("")}
function nav(){return `<nav class="game-map" aria-label="Переходы между уровнями">${LEVELS.map((l,i)=>`<button type="button" class="quiet-btn ${i===levelIndex?"selected":""}" data-action="jump" data-level="${i}" aria-current="${i===levelIndex?"page":"false"}">${i+1}. ${l.short}</button>`).join("")}</nav>`}
function equation(t,mode){if(mode==="plus")return `${t.a} <span class="op">+</span> ${t.b} <span class="equals">= ?</span>`;if(mode==="minus")return `${t.a} <span class="op minus">−</span> ${t.b} <span class="equals">= ?</span>`;if(mode==="missing")return `${t.a} <span class="op">+</span> ? <span class="equals">=</span> ${t.answer}`;return `${t.answer} <span class="equals">=</span> ? <span class="op">+</span> ?`}
function tile(o,selected,mode){return `<button type="button" class="tile ${selected?(mode==="remove"?"removed":"selected"):""}" data-action="tile" data-id="${o.id}" aria-pressed="${selected}" aria-label="Буква ${o.ch}" ${selected&&mode!=="remove"?"disabled":""}>${o.ch}</button>`}
function getTarget(){let t=current(),mode=LEVELS[levelIndex].mode;return phase==="split1"?t.part1:phase==="split2"?t.part2:mode==="missing"?t.missing:t.answer}
function slots(word){return Array.from({length:word.length},(_,i)=>{const o=pool.find(x=>x.id===choiceIds[i]);return `<button type="button" class="answer-slot ${o?"filled":""}" data-action="remove-answer" data-index="${i}" ${o?`aria-label="Убрать букву ${o.ch} из ответа"`:"disabled aria-label='Пустое место'"}>${o?o.ch:"·"}</button>`}).join("")}
function fb(){return `<div class="info-box ${feedbackType}" role="status">${feedback||"&nbsp;"}</div>`}
function renderRemove(t){return `<h2 class="mission-heading">Шаг 1. Вычти буквы</h2><p class="helptext">Нажми в слове <b>${t.a}</b> на все буквы слова <b>${t.b}</b>. Каждую букву отмечай столько раз, сколько она встречается во втором слове.</p><div class="play-board removing"><div class="tiles">${pool.map(o=>tile(o,removeIds.includes(o.id),"remove")).join("")}</div><div class="step-meter">Отмечено ${removeIds.length} из ${t.b.length}</div></div><div class="controls"><button type="button" class="secondary-btn" data-action="clear-remove" ${!removeIds.length?"disabled":""}>↶ Сбросить</button><button type="button" class="secondary-btn" data-action="hint">💡 Подсказка</button><button type="button" class="primary-btn" data-action="check-remove" ${removeIds.length!==t.b.length?"disabled":""}>Проверить вычитание ✓</button></div>${fb()}`}
function renderBuild(){const t=current(),mode=LEVELS[levelIndex].mode,target=getTarget();let heading=mode==="minus"?"Шаг 2. Собери оставшееся слово":mode==="missing"?"Какое слово пропущено?":"Собери новое слово";let instructions="Нажимай на буквы по порядку. Каждую букву можно использовать только один раз.";let extra="";
 if(mode==="split"){
  heading=phase==="split1"?"Шаг 1. Найди первое слово":"Шаг 2. Найди второе слово";
  instructions=phase==="split1"?`Собери слово из <strong>${t.part1.length} букв</strong> по первой подсказке. После проверки оставшиеся буквы пригодятся для второго слова.`:`Первое слово получилось: <strong>${t.part1}</strong>. Теперь используй все оставшиеся буквы, чтобы собрать второе слово.`;
  extra=`<div class="split-summary"><span class="part ${phase==="split1"?"active":""}">${phase==="split1"?"?":t.part1}</span><span class="between">+</span><span class="part ${phase==="split2"?"active":""}">?</span><span class="between">=</span><span class="part">${t.answer}</span></div>`;
 }
 return `${extra}<h2 class="mission-heading">${heading}</h2><p class="helptext">${instructions}</p><div class="answer-row">${slots(target)}</div><div class="play-board"><div class="tiles">${pool.map(o=>tile(o,choiceIds.includes(o.id),"build")).join("")}</div><div class="step-meter">Выбрано ${choiceIds.length} из ${target.length} букв</div></div><div class="controls"><button type="button" class="secondary-btn" data-action="undo" ${!choiceIds.length?"disabled":""}>↶ Убрать букву</button><button type="button" class="secondary-btn" data-action="hint">💡 Подсказка</button><button type="button" class="primary-btn" data-action="check" ${choiceIds.length!==target.length?"disabled":""}>${mode==="split"&&phase==="split1"?"Проверить первое слово":"Проверить ответ"} ✓</button></div>${fb()}`}
function renderTask(){const t=current(),l=LEVELS[levelIndex],done=solved(levelIndex,taskIndex),mode=l.mode;let body="",description=mode==="split"?`<div class="split-clues"><div class="clue">🔎 <span><b>Слово 1:</b> ${t.clue1}</span></div><div class="clue">🔎 <span><b>Слово 2:</b> ${t.clue2}</span></div></div>`:`<p class="clue">🔎 <span><b>${mode==="missing"?"Значение пропущенного слова":"Подсказка"}:</b> ${t.clue}</span></p>`;
 if(done){let solvedValue=mode==="split"?`${t.part1} + ${t.part2} = ${t.answer}`:mode==="missing"?`${t.a} + ${t.missing} = ${t.answer}`:t.answer;
  body=`<div class="success-state"><div class="success-burst">🌟</div><h2>Верно! Задание решено.</h2><p>${mode==="split"?"Ты разделил(а) большое слово на два новых.":"Ты правильно использовал(а) все буквы."}</p><div class="solved-word small">${solvedValue}</div><div class="controls"><button type="button" class="secondary-btn" data-action="home">⌂ Все уровни</button>${taskIndex<5?`<button type="button" class="primary-btn" data-action="next">Следующее задание →</button>`:count(levelIndex)===6?`<button type="button" class="primary-btn" data-action="finish">🏆 Итог уровня</button>`:`<button type="button" class="primary-btn" data-action="next-unsolved">К незавершённому →</button>`}</div></div>`;
 }else body=(phase==="remove"?renderRemove(t):renderBuild());
 screen.innerHTML=`<div class="lesson-top"><div><div class="section-label">УРОВЕНЬ ${levelIndex+1} ИЗ 5</div><h1>${l.name}</h1></div><div class="status-pill">⭐ ${count(levelIndex)} / 6</div></div>${nav()}<nav class="progress-panel" aria-label="Задания"><div class="progress-dots">${dots()}</div><span class="progress-label">Выбери №</span></nav><section class="task-card"><div class="task-title-row"><span class="task-number">Задание ${taskIndex+1} из 6</span><span class="task-phase ${mode==="minus"?"subtract":""}">${mode==="minus"?"➖ Вычитаем":mode==="split"?"🧩 Разделяем":mode==="missing"?"❔ Ищем": "➕ Складываем"}</span></div><div class="equation">${equation(t,mode)}</div>${done?"":description}${body}</section>${done?"":`<p class="teacher-note">Если ошибся, попробуй снова: ошибка не уменьшает результат. Для сложения и разложения используй все буквы без остатка.</p>`}`}
function renderFinish(){const allDone=total()===MAX_TASKS,next=LEVELS.findIndex((l,i)=>count(i)<l.tasks.length);screen.innerHTML=`<section class="level-finish"><div class="big-medal">${allDone?"🏆":"🥇"}</div><span class="page-eyebrow">Уровень ${levelIndex+1} пройден</span><h2>${allDone?"Все пять уровней пройдены!":"Шесть задач решено!"}</h2><p>${allDone?"Ты сумел(а) складывать, вычитать и разбирать слова на части. Отличная работа!":"Попробуй следующий уровень или выбери другой. Твои правильные ответы сохраняются в этом браузере."}</p><div class="finish-buttons"><button type="button" class="secondary-btn" data-action="home">⌂ К уровням</button>${next>=0?`<button type="button" class="primary-btn" data-action="jump" data-level="${next}">Перейти к уровню ${next+1} →</button>`:""}<button type="button" class="secondary-btn" data-action="replay">↻ Начать уровень заново</button></div><p class="mini-note">Всего решено: ${total()} из ${MAX_TASKS}</p></section>`}
function notice(message,type=""){feedback=message;feedbackType=type;render()}
function handleTile(id){if(solved(levelIndex,taskIndex))return;const tile=pool.find(o=>o.id===id);if(!tile)return;if(phase==="remove"){if(removeIds.includes(id))removeIds=removeIds.filter(x=>x!==id);else if(removeIds.length<current().b.length)removeIds.push(id);else{notice("Сначала сними отметку с другой буквы.","tip");return}}else{if(choiceIds.includes(id)||choiceIds.length>=getTarget().length)return;choiceIds.push(id)}feedback="";sound("click");render()}
function checkRemove(){const t=current();if(!countsMatch(removeIds.map(id=>pool.find(o=>o.id===id).ch),[...t.b])){notice("Букв нужное количество, но некоторые выбраны неверно. Сравни со вторым словом.","error");sound("wrong");return}pool=shuffle(pool.filter(o=>!removeIds.includes(o.id)),taskIndex+51);removeIds=[];choiceIds=[];phase="build";hintCount=0;notice("Верно! Теперь сложи новое слово из оставшихся букв.","tip");sound("success")}
function finishTask(){const target=getTarget();if(choiceIds.length!==target.length)return;const answer=choiceIds.map(id=>pool.find(o=>o.id===id).ch).join("");if(answer!==target){notice("Все нужные буквы выбраны, но порядок не подходит к подсказке. Попробуй иначе.","error");sound("wrong");return}
 if(phase==="split1"){
  // Exact ids picked for the first word are removed: duplicate letters are accounted for.
  pool=shuffle(pool.filter(o=>!choiceIds.includes(o.id)),taskIndex+70);choiceIds=[];phase="split2";hintCount=0;notice("Первое слово найдено! Из оставшихся букв собери второе.","tip");sound("success");return;
 }
 if(!solved(levelIndex,taskIndex))progress.solved[levelIndex].push(taskIndex);save();sound("success");confetti(15);render()}
function hint(){const t=current();hintCount++;if(phase==="remove"){notice(`Посмотри на слово «${t.b}». Найди все его буквы в первом слове, учитывая повторы.`,"tip");return}const word=getTarget();let msg=hintCount===1?`Искомое слово содержит ${word.length} букв и начинается на «${word[0]}».`:`Первые буквы: «${word.slice(0,Math.min(2,word.length))}». ${LEVELS[levelIndex].mode==="split"?(phase==="split1"?t.clue1:t.clue2):t.clue}.`;notice(msg,"tip")}
function nextTask(){const length=LEVELS[levelIndex].tasks.length;if(taskIndex+1<length)goTask(taskIndex+1);else if(count(levelIndex)===length){view="finish";confetti(28);render()}else{const n=LEVELS[levelIndex].tasks.findIndex((_,i)=>!solved(levelIndex,i));goTask(n)}}
function replay(){if(!confirm("Начать этот уровень заново? Результаты шести его заданий будут сброшены."))return;progress.solved[levelIndex]=[];save();goTask(0)}
function confetti(n){const chars=["⭐","✦","✨","✳","●"];for(let i=0;i<n;i++){const el=document.createElement("span");el.className="confetti";el.textContent=chars[i%chars.length];el.style.left=((i*71+23)%99)+"%";el.style.animationDelay=(i%7)*.07+"s";el.style.color=["#ec8756","#11979a","#8766ac","#e5b655"][i%4];document.body.appendChild(el);setTimeout(()=>el.remove(),2100)}}
screen.addEventListener("click",event=>{const btn=event.target.closest("button[data-action]");if(!btn)return;const act=btn.dataset.action;if(act==="start"||act==="jump")startLevel(Number(btn.dataset.level));else if(act==="task")goTask(Number(btn.dataset.index));else if(act==="home")goHome();else if(act==="tile")handleTile(Number(btn.dataset.id));else if(act==="clear-remove"){removeIds=[];feedback="";render()}else if(act==="check-remove")checkRemove();else if(act==="remove-answer"){choiceIds.splice(Number(btn.dataset.index),1);feedback="";render()}else if(act==="undo"){choiceIds.pop();feedback="";render()}else if(act==="hint")hint();else if(act==="check")finishTask();else if(act==="next")nextTask();else if(act==="next-unsolved"){let n=LEVELS[levelIndex].tasks.findIndex((_,i)=>!solved(levelIndex,i));if(n>=0)goTask(n);else{view="finish";render()}}else if(act==="finish"){view="finish";confetti(28);render()}else if(act==="replay")replay()});
document.getElementById("homeBtn").addEventListener("click",goHome);
document.getElementById("soundBtn").addEventListener("click",()=>{soundOn=!soundOn;render();if(soundOn)sound("click")});
document.addEventListener("keydown",e=>{if(view!=="task"||solved(levelIndex,taskIndex)||e.ctrlKey||e.altKey||e.metaKey||e.target.matches("input,textarea,[contenteditable]"))return;if(phase==="remove")return;if(e.key==="Backspace"){e.preventDefault();choiceIds.pop();feedback="";render()}else if(/^[А-ЯЁа-яё]$/.test(e.key)){const ch=e.key.toUpperCase(),tile=pool.find(o=>o.ch===ch&&!choiceIds.includes(o.id));if(tile)handleTile(tile.id)}});
validateData();render();
</script></body></html>
